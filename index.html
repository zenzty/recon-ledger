<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMP Bases</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Drag-and-Drop Overlay -->
  <div id="dropzone-overlay" class="dropzone-overlay" hidden>
    <div class="dropzone-frame">
      <div class="dropzone-title">Drop Screenshot to Add Base</div>
      <div class="dropzone-sub">Reads player name and F3 coordinates automatically</div>
    </div>
  </div>

  <div class="page-shell">
    <!-- Minimal Header -->
    <header class="site-header">
      <div class="header-left">
        <h1 class="site-title">Bases</h1>
        <span class="site-count" id="header-summary">16 targets</span>
      </div>

      <nav class="view-switch" aria-label="View mode">
        <button type="button" class="view-btn is-active" data-view="grid">Grid</button>
        <button type="button" class="view-btn" data-view="table">Table</button>
        <button type="button" class="view-btn" data-view="map">Map</button>
      </nav>

      <div class="header-right">
        <button type="button" class="btn-ghost" id="btn-export-xaero" title="Copy all active unraided waypoints for Xaero's Minimap">
          Copy All Xaero
        </button>
        <button type="button" class="btn-ghost" id="btn-download-xaero" title="Download mw$default_1.txt waypoint file">
          Download .txt
        </button>
        <button type="button" class="btn-primary" id="btn-open-ingest">
          + Add Base
        </button>
      </div>
    </header>

    <!-- Minimal Filter Bar -->
    <section class="filter-bar">
      <div class="status-tabs" id="filter-status">
        <button type="button" class="status-tab is-active" data-status="all">
          All <span class="tab-count" id="count-all">16</span>
        </button>
        <button type="button" class="status-tab" data-status="priority">
          Priority <span class="tab-count" id="count-priority">9</span>
        </button>
        <button type="button" class="status-tab" data-status="scouted">
          Scouted <span class="tab-count" id="count-scouted">7</span>
        </button>
        <button type="button" class="status-tab" data-status="raided">
          Raided <span class="tab-count" id="count-raided">0</span>
        </button>
      </div>

      <div class="filter-controls">
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="Search name, coords, notes..."
          autocomplete="off"
        />
      </div>
    </section>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <!-- VIEW 1: MINIMAL GRID -->
      <section id="view-grid" class="view-section">
        <div id="bases-grid" class="bases-grid"></div>
      </section>

      <!-- VIEW 2: MINIMAL TABLE -->
      <section id="view-table" class="view-section" hidden>
        <div class="table-wrap">
          <table class="bases-table">
            <thead>
              <tr>
                <th>Base</th>
                <th>Status</th>
                <th class="num">Coords (X, Y, Z)</th>
                <th class="num">Nether (÷8)</th>
                <th>Notes</th>
                <th class="num">Actions</th>
              </tr>
            </thead>
            <tbody id="bases-tbody"></tbody>
          </table>
        </div>
      </section>

      <!-- VIEW 3: MINIMAL 2D MAP -->
      <section id="view-map" class="view-section" hidden>
        <div class="map-container">
          <div class="map-stage" id="radar-container">
            <canvas id="radar-canvas"></canvas>
            <div class="map-legend">
              <span class="map-coord-readout" id="radar-cursor-readout">0, 0</span>
              <button type="button" class="btn-text" id="radar-reset-view">Reset Zoom</button>
            </div>
          </div>
          <aside class="map-card" id="map-selected-card" hidden></aside>
        </div>
      </section>
    </main>
  </div>

  <!-- DETAIL & EDIT MODAL -->
  <div id="dossier-modal" class="modal-backdrop" hidden role="dialog" aria-modal="true">
    <div class="modal-sheet modal-sheet-wide">
      <header class="modal-header">
        <div class="modal-title-wrap">
          <h2 class="modal-title" id="dossier-title">artap2</h2>
          <span class="modal-sub" id="dossier-coords-sub">-4920, -18, -1237</span>
        </div>
        <div class="modal-header-actions">
          <button type="button" class="btn-ghost" id="dossier-prev">← Prev</button>
          <button type="button" class="btn-ghost" id="dossier-next">Next →</button>
          <button type="button" class="btn-ghost" id="dossier-close">Close</button>
        </div>
      </header>

      <div class="dossier-layout">
        <div class="dossier-image-col">
          <div class="dossier-viewport" id="dossier-viewport" title="Scroll to zoom, drag to pan, double-click to reset">
            <img id="dossier-img" src="" alt="Base screenshot" draggable="false" />
          </div>
          <div class="dossier-image-bar">
            <span class="muted-hint">Scroll to zoom · Drag to pan · Double-click to reset</span>
            <div class="quick-copy-row">
              <button type="button" class="btn-ghost" id="dossier-copy-xyz">Copy XYZ</button>
              <button type="button" class="btn-primary" id="dossier-copy-xaero">Copy Xaero Waypoint</button>
            </div>
          </div>
        </div>

        <form id="dossier-form" class="dossier-form">
          <div class="field">
            <label for="edit-name">Base / Player Name</label>
            <input type="text" id="edit-name" class="input" required />
          </div>

          <div class="field-row-2">
            <div class="field">
              <label for="edit-status">Status</label>
              <select id="edit-status" class="select">
                <option value="priority">Priority (To Raid)</option>
                <option value="scouted">Scouted</option>
                <option value="raided">Raided (Done)</option>
              </select>
            </div>
            <div class="field">
              <label for="edit-dimension">Dimension</label>
              <select id="edit-dimension" class="select">
                <option value="overworld">Overworld</option>
                <option value="the_end">The End</option>
                <option value="the_nether">Nether</option>
              </select>
            </div>
          </div>

          <div class="field-row-3">
            <div class="field">
              <label for="edit-x">X</label>
              <input type="number" id="edit-x" class="input mono" required />
            </div>
            <div class="field">
              <label for="edit-y">Y</label>
              <input type="number" id="edit-y" class="input mono" required />
            </div>
            <div class="field">
              <label for="edit-z">Z</label>
              <input type="number" id="edit-z" class="input mono" required />
            </div>
          </div>

          <div class="nether-readout" id="dossier-nether-readout">
            Nether Roof (÷8): -615, 128, -155
          </div>

          <div class="field">
            <label for="edit-containers">Loot Summary (1 line)</label>
            <input type="text" id="edit-containers" class="input" placeholder="e.g. 15 chests, 2 shulkers, spawner" />
          </div>

          <div class="field">
            <label for="edit-notes">Notes</label>
            <textarea id="edit-notes" class="textarea" rows="4" placeholder="Details, online players, access route..."></textarea>
          </div>

          <div class="form-footer">
            <button type="button" class="btn-danger" id="btn-delete-base">Delete</button>
            <button type="submit" class="btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- ADD BASE MODAL -->
  <div id="ingest-modal" class="modal-backdrop" hidden role="dialog" aria-modal="true">
    <div class="modal-sheet modal-sheet-narrow">
      <header class="modal-header">
        <h2 class="modal-title">Add Base</h2>
        <button type="button" class="btn-ghost" id="ingest-close">Close</button>
      </header>

      <form id="ingest-form" class="ingest-form">
        <label for="ingest-file-input" class="upload-box" id="ingest-drop-box">
          <input type="file" id="ingest-file-input" accept="image/png,image/jpeg,image/webp" hidden />
          <div id="ingest-preview-empty">
            <div class="upload-title">Drop F3 screenshot or click to upload</div>
            <div class="upload-sub" id="ocr-status-text">Optional — auto-fills name and coordinates</div>
          </div>
          <img id="ingest-preview-img" src="" alt="Preview" hidden />
        </label>

        <div class="field-row-2">
          <div class="field">
            <label for="new-name">Name *</label>
            <input type="text" id="new-name" class="input" required placeholder="Player or base name" />
          </div>
          <div class="field">
            <label for="new-status">Status</label>
            <select id="new-status" class="select">
              <option value="priority">Priority (To Raid)</option>
              <option value="scouted" selected>Scouted</option>
              <option value="raided">Raided</option>
            </select>
          </div>
        </div>

        <div class="field-row-3">
          <div class="field">
            <label for="new-x">X *</label>
            <input type="number" id="new-x" class="input mono" required placeholder="-4920" />
          </div>
          <div class="field">
            <label for="new-y">Y *</label>
            <input type="number" id="new-y" class="input mono" required value="-54" />
          </div>
          <div class="field">
            <label for="new-z">Z *</label>
            <input type="number" id="new-z" class="input mono" required placeholder="-1237" />
          </div>
        </div>

        <div class="field-row-2">
          <div class="field">
            <label for="new-dimension">Dimension</label>
            <select id="new-dimension" class="select">
              <option value="overworld">Overworld</option>
              <option value="the_end">The End</option>
              <option value="the_nether">Nether</option>
            </select>
          </div>
          <div class="field">
            <label for="new-containers">Loot Summary</label>
            <input type="text" id="new-containers" class="input" placeholder="e.g. Shulkers, villager hall" />
          </div>
        </div>

        <div class="field">
          <label for="new-notes">Notes</label>
          <textarea id="new-notes" class="textarea" rows="2" placeholder="Optional notes..."></textarea>
        </div>

        <div class="form-footer">
          <button type="button" class="btn-ghost" id="ingest-cancel">Cancel</button>
          <button type="submit" class="btn-primary">Add Base</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast-bar" class="toast-bar" hidden></div>

  <script src="./app.js"></script>
</body>
</html>
